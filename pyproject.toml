[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "vol-surf"
version = "1.0.0"
description = "Black-76 pricing and interpolation of European option volatility surfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/rishixgamer/vol-surf"
Issues = "https://github.com/rishixgamer/vol-surf/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vol_surf"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]
